<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awaken model editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <strong class="brand">Awaken models</strong>
  <button id="btnOpen" title="Pick the assets/models folder (Chrome/Edge); Save then writes back into it">Open folder</button>
  <button id="btnFiles" title="Fallback: choose the model files; Save downloads the changed files">Open files</button>
  <button id="btnSave" title="Ctrl+S">Save</button>
  <span class="sep"></span>
  <button id="btnUndo" title="Ctrl+Z">Undo</button>
  <button id="btnRedo" title="Ctrl+Y">Redo</button>
  <span class="sep"></span>
  <button id="btnNew">New</button>
  <button id="btnDup">Duplicate</button>
  <button id="btnDel">Delete</button>
  <span class="sep"></span>
  <div id="modes" class="tabs">
    <button data-mode="zx">ZX view</button>
    <button data-mode="edit" class="on">Edit 3D</button>
    <button data-mode="front">Front</button>
    <button data-mode="side">Side</button>
    <button data-mode="top">Top</button>
  </div>
  <span id="status" class="status"></span>
</header>

<main>
  <aside id="left">
    <input id="search" type="search" placeholder="Search models" autocomplete="off">
    <div id="list"></div>
  </aside>

  <section id="center">
    <div id="viewbar"></div>
    <canvas id="view" width="900" height="640" tabindex="0"></canvas>
    <div id="hint" class="hint"></div>
  </section>

  <aside id="right">
    <details open class="panel" id="pModel"><summary>Model</summary><div id="model"></div></details>
    <details open class="panel"><summary>ZX preview</summary><canvas id="thumb" class="thumb"></canvas></details>
    <details open class="panel"><summary>Vertex groups <small id="vcount"></small></summary><div id="groups"></div></details>
    <details open class="panel"><summary>Faces <small id="fcount"></small></summary><div id="faces"></div></details>
    <details open class="panel"><summary>Validation <small id="vstat"></small></summary><div id="valid"></div></details>
  </aside>
</main>

<dialog id="dlgNew">
  <form method="dialog" id="newForm">
    <h3>New model</h3>
    <label>Name (assembler label) <input id="newName" required pattern="[A-Za-z_][A-Za-z0-9_]*"></label>
    <label>Type <select id="newKind"></select></label>
    <label>Section of index.txt <select id="newSection"></select></label>
    <label>Start from <select id="newFrom"><option value="wedge">ship skeleton (wedge)</option><option value="empty">empty</option><option value="copy">copy of the current model</option></select></label>
    <p class="note" id="newNote"></p>
    <menu><button value="cancel" type="button" id="newCancel">Cancel</button><button value="ok" id="newOk">Create</button></menu>
  </form>
</dialog>
<dialog id="dlgInfo"><div id="infoBody"></div><menu><button id="infoOk">OK</button></menu></dialog>
<input type="file" id="fileInput" multiple hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
